[package]
name = "minou"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "=0.2.100"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Storage", "HtmlCanvasElement", "CanvasRenderingContext2d", "CanvasGradient",
  "SpeechSynthesis", "SpeechSynthesisUtterance", "SpeechSynthesisVoice",
  "Performance", "PointerEvent", "TouchEvent", "Touch", "TouchList", "KeyboardEvent",
  "DomRect", "Element", "HtmlElement", "VisibilityState", "Navigator", "ServiceWorkerContainer",
  "AudioContext", "BaseAudioContext", "OscillatorNode", "OscillatorType", "GainNode", "AudioParam",
  "AudioNode", "AudioDestinationNode", "AudioScheduledSourceNode", "AudioContextState",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
